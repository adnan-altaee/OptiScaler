# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build (No Signing)

on:
  workflow_dispatch:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        
    - name: Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        # Ensure the file exists before proceeding
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }
        
        # Helper function to extract the first matching line for a version component
        function Get-Version-Component {
            param (
                [string]$pattern,
                [string]$replacement
            )
            # Use Select-String and take only the first match
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) {
                return ($line.Line -replace $replacement).Trim()
            } else {
                Write-Error "Pattern not found: $pattern"
                exit 1
            }
        }
        
        # Extract version components (only the first match for each pattern)
        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'
        
        # Merge into a single version string
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        
        # Get the current date in a specific format (e.g., YYYYMMDD)
        $date = Get-Date -Format "yyyyMMdd"
        
        # Construct the output filename with version and date
        $outputFileName = "OptiScaler_${version}_${date}"
        
        # Output the generated filename
        Write-Output "Generated Filename: $outputFileName"
        
        # Write outputs to GITHUB_OUTPUT
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
      continue-on-error: false
      
    - name: Debug Outputs
      run: |
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Filename: ${{ steps.get_version.outputs.filename }}"
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal
      
    - name: Compress the artifact 
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r ${{ github.workspace }}\$zipName ${{ github.workspace }}\x64\Release\a\*.*

      continue-on-error: false
        
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error

    # Also publish the bare DLL (zipped by GitHub) so it can be checked and installed without 7-Zip
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: 'OptiScaler-dll'
        path: '${{ github.workspace }}\x64\Release\a\OptiScaler.dll'
        if-no-files-found: error

    # Mod package: Frame Generation for Assassin's Creed Origins (mods\acorigins-framegen)
    - name: Package the Assassin's Creed Origins frame generation mod
      if: ${{ hashFiles('mods/acorigins-framegen/package.ps1') != '' }}
      shell: powershell
      run: |
        powershell -NoProfile -ExecutionPolicy Bypass -File mods\acorigins-framegen\package.ps1 -BuildDir x64\Release\a -OutDir mod-package

    - uses: actions/upload-artifact@v7.0.0
      if: ${{ hashFiles('mods/acorigins-framegen/package.ps1') != '' }}
      with:
        name: 'ACOrigins-FrameGen'
        path: '${{ github.workspace }}\mod-package\ACOrigins-FrameGen\'
        if-no-files-found: error

    # The bare DLL on the 'builds' branch (one commit, replaced every run), for tools that can read the repository
    # but not download Actions artifacts
    - name: Publish the DLL to the builds branch
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $env:RUNNER_TEMP 'builds-branch'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        Copy-Item x64\Release\a\OptiScaler.dll $dir
        $hash = (Get-FileHash (Join-Path $dir 'OptiScaler.dll') -Algorithm SHA256).Hash.ToLower()
        Set-Content -Path (Join-Path $dir 'BUILD.txt') -Value @(
          "commit=${{ github.sha }}", "branch=${{ github.ref_name }}", "run=${{ github.run_id }}", "sha256=$hash")
        Set-Location $dir
        git init -q -b builds
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add OptiScaler.dll BUILD.txt
        git commit -q -m "Build of ${{ github.sha }} (${{ github.ref_name }}, run ${{ github.run_id }})"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
